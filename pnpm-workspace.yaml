# pnpm 11 requires explicit approval before a dependency's install scripts run.
# Without this block `pnpm install` exits non-zero with ERR_PNPM_IGNORED_BUILDS,
# which is what made the Pages workflow fail at "Install dependencies".
allowBuilds:
  esbuild: true
  less: true
  vue-demi: true
patchedDependencies:
  vitepress-theme-async@0.0.30: patches/vitepress-theme-async@0.0.30.patch
